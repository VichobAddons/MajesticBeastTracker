name: Bug Report
description: Report a bug or issue with Majestic Beast Tracker
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Addon Version
      placeholder: e.g. v2.0.0, v2.0.1-alpha2
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: WoW Client Language
      placeholder: e.g. enUS, deDe, frFR
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. Open tracker
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: false

  - type: textarea
    id: error
    attributes:
      label: Error Message
      description: If you have BugSack/BugGrabber installed, paste the error message here.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false

  - type: textarea
    id: character-info
    attributes:
      label: Character Info
      description: Help us understand your setup.
      value: |
        - How many skinners do you have?
        - Talented Tracker points (0-40)?
        - Any other relevant addons (TSM, Auctionator)?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context about the problem.
    validations:
      required: false
